<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ticket-demo studio</title>
    <style>
      :root {
        --bg: #0f1419;
        --card: #ffffff;
        --muted: #64748b;
        --ink: #0f172a;
        --line: #e2e8f0;
        --good: #047857;
        --warn: #b45309;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: white;
      }
      body {
        background:
          radial-gradient(900px 480px at 18% 40%, #1e293b 0%, transparent 70%),
          linear-gradient(180deg, #111827 0%, #0b1220 100%);
      }
      .stage {
        position: absolute;
        left: 48px;
        top: 56px;
        width: 620px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .kicker {
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #94a3b8;
        opacity: 0;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .card {
        background: var(--card);
        color: var(--ink);
        border-radius: 14px;
        padding: 18px 18px 16px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        min-height: 132px;
        opacity: 0;
        transform: translateY(10px);
      }
      .label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 14px;
      }
      [hidden] { display: none !important; }
      .info {
        width: 14px;
        height: 14px;
        border-radius: 99px;
        border: 1.5px solid #94a3b8;
        color: #64748b;
        font-size: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .value {
        margin-top: 8px;
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .value.up { color: var(--good); }
      .method {
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
        min-height: 18px;
        letter-spacing: -0.01em;
      }
      .method.missing { color: var(--warn); font-weight: 600; }
      .chips {
        display: flex;
        gap: 8px;
        opacity: 0;
      }
      .chip {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(255,255,255,0.08);
        color: #e2e8f0;
        border: 1px solid rgba(148,163,184,0.35);
      }
      .chip.on {
        background: #0f766e;
        border-color: #14b8a6;
      }
      .chip.strike {
        text-decoration: line-through;
        color: #fda4af;
        background: rgba(127,29,29,0.45);
        border-color: #fb7185;
      }
      .footer {
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
        color: #e2e8f0;
        opacity: 0;
      }
      .on { opacity: 1; transform: none; transition: opacity 420ms ease, transform 420ms ease; }
      .type {
        display: inline-block;
        border-right: 2px solid #94a3b8;
        padding-right: 1px;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="kicker" id="kicker">Ticket 142 · return method</div>
      <div class="row">
        <div class="card" id="cardA">
          <div class="label">Annual rate of return <span class="info" id="infoA" hidden>i</span></div>
          <div class="value up">+12.40%</div>
          <div class="method" id="methodA"></div>
        </div>
        <div class="card" id="cardB">
          <div class="label">Period return <span class="info" id="infoB" hidden>i</span></div>
          <div class="value up">+3.10%</div>
          <div class="method" id="methodB"></div>
        </div>
      </div>
      <div class="chips" id="chips">
        <span class="chip" id="chipTwr">TWR</span>
        <span class="chip" id="chipMwr">MWR</span>
      </div>
      <div class="footer" id="footer"></div>
    </div>
    <script>
      const beats = JSON.parse(document.body.dataset.beats || "[]");

      function show(id) {
        document.getElementById(id)?.classList.add("on");
      }

      function typeInto(el, text, ms) {
        el.textContent = "";
        el.classList.add("type");
        const step = Math.max(18, Math.floor(ms / Math.max(text.length, 1)));
        let i = 0;
        const t = setInterval(() => {
          el.textContent = text.slice(0, i);
          i += 1;
          if (i > text.length) {
            clearInterval(t);
            el.classList.remove("type");
          }
        }, step);
      }

      const actions = {
        kicker: () => show("kicker"),
        cards: () => {
          show("cardA");
          show("cardB");
        },
        missing: () => {
          const a = document.getElementById("methodA");
          const b = document.getElementById("methodB");
          a.className = "method missing";
          b.className = "method missing";
          typeInto(a, "No method named", 700);
          typeInto(b, "TWR or MWR?", 700);
        },
        info: () => {
          document.getElementById("infoA").hidden = false;
          document.getElementById("infoB").hidden = false;
          document.getElementById("methodA").textContent = "";
          document.getElementById("methodB").textContent = "";
          document.getElementById("methodA").className = "method";
          document.getElementById("methodB").className = "method";
        },
        methods: () => {
          const a = document.getElementById("methodA");
          const b = document.getElementById("methodB");
          a.className = "method";
          b.className = "method";
          typeInto(a, "Vs cost basis · not TWR or MWR", 900);
          typeInto(b, "Simple period · cash-flow aware · not TWR", 900);
        },
        summary: () => show("kicker"),
        perf: () => {},
        versus: () => {
          const a = document.getElementById("methodA");
          if (a && !a.textContent) typeInto(a, "Vs cost basis · not TWR or MWR", 700);
        },
        period: () => {
          const b = document.getElementById("methodB");
          if (b) typeInto(b, "Simple period · cash-flow aware · not TWR", 800);
        },
        twr: () => {
          show("chips");
          document.getElementById("chipTwr")?.classList.add("on");
        },
        mwr: () => {
          document.getElementById("chipMwr")?.classList.add("on");
        },
        strike: () => {
          document.getElementById("chipTwr")?.classList.add("strike");
          document.getElementById("chipMwr")?.classList.add("strike");
        },
        footer: () => {
          const el = document.getElementById("footer");
          show("footer");
          typeInto(el, "We do not compute TWR or MWR — the number is labeled, not renamed.", 1100);
        },
      };

      for (const beat of beats) {
        window.setTimeout(() => actions[beat.action]?.(), beat.at);
      }
    </script>
  </body>
</html>
